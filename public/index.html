<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>录屏助手</title>
<link rel="stylesheet" href="/app.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo"><span></span></div>
      <div class="brand-text">
        <h1 data-i18n="app.title">录屏助手</h1>
        <p data-i18n="app.subtitle">屏幕 + 系统声音 · 本地转写 · AI 边录边记</p>
      </div>
    </div>
    <div class="top-actions">
      <span id="llmBadge" class="badge badge-wait" data-i18n="badge.checking">检测中…</span>
      <button id="btnSettings" class="ghost" data-i18n="nav.settings">设置</button>
      <button id="btnHistory" class="ghost" data-i18n="nav.history">历史录制</button>
    </div>
  </header>

  <main>
    <section class="stage">
      <div class="preview-wrap" id="previewWrap">
        <video id="preview" muted playsinline></video>
        <div class="placeholder" id="placeholder">
          <div class="ph-icon">⏺</div>
          <h2 data-i18n="placeholder.title">把线上会议的画面和声音一起录下来</h2>
          <p data-i18n-html="placeholder.desc">点「开始录制」后，选择 <b>整个屏幕</b>，并勾选 <b>同时分享系统音频</b>。</p>
          <div class="ph-steps">
            <span data-i18n="placeholder.step1">1 选整个屏幕</span><i>→</i>
            <span data-i18n="placeholder.step2">2 勾选系统音频</span><i>→</i>
            <span data-i18n="placeholder.step3">3 点分享</span>
          </div>
        </div>
        <div class="rec-badge" id="recBadge" hidden><span class="dot"></span>REC<span id="timer">00:00</span></div>
        <div class="screen-flags" id="screenFlags" hidden>
          <span id="flagSys" class="flag" data-i18n="flag.system">系统声音</span>
          <span id="flagMic" class="flag" data-i18n="flag.mic">麦克风</span>
        </div>
        <div class="pause-veil" id="pauseVeil" hidden data-i18n="rec.paused">已暂停</div>
      </div>

      <div class="meter-row">
        <div class="meter"><div class="meter-fill" id="meterFill"></div><div class="meter-peak" id="meterPeak"></div></div>
        <div class="meter-label" id="meterLabel">-∞ dB</div>
        <div class="meter-tip" id="meterTip"></div>
      </div>

      <div class="controls">
        <button id="btnStart" class="primary" data-i18n="btn.start">开始录制</button>
        <button id="btnPause" class="ghost" disabled data-i18n="btn.pause">暂停</button>
        <button id="btnStop" class="danger" disabled data-i18n="btn.stop">结束并生成纪要</button>
        <button id="btnCancel" class="ghost" disabled data-i18n="btn.cancel">取消</button>
        <div class="spacer"></div>
        <label class="switch" title="">
          <input type="checkbox" id="optMic" checked /><span data-i18n="opt.mic">麦克风</span>
        </label>
        <select id="optQuality">
          <option value="high" data-i18n="quality.high">高清 1080p·30fps</option>
          <option value="std" selected data-i18n="quality.std">标准 1080p·15fps</option>
          <option value="lite" data-i18n="quality.lite">轻量 720p·15fps</option>
        </select>
      </div>
      <p class="hint" id="hint" data-i18n="hint.idle">提示：录制时请保持本页面打开。</p>
    </section>

    <aside class="side">
      <div class="tabs">
        <button class="tab active" data-tab="transcript" data-i18n="tab.transcript">实时字幕</button>
        <button class="tab" data-tab="summary" data-i18n="tab.summary">AI 纪要</button>
        <button class="tab" data-tab="ask" data-i18n="tab.ask">提问</button>
      </div>
      <div class="tab-body" id="tab-transcript">
        <div id="transcript" class="transcript">
          <div class="empty" data-i18n="empty.transcript">开始录制后，这里会实时出现文字。</div>
        </div>
      </div>
      <div class="tab-body" id="tab-summary" hidden>
        <div id="summary" class="markdown">
          <div class="empty" data-i18n="empty.summary">AI 会边录边整理纪要，大约每 30 秒刷新一次。</div>
        </div>
      </div>
      <div class="tab-body" id="tab-ask" hidden>
        <div id="chat" class="chat">
          <div class="empty" data-i18n="empty.ask">录屏过程中可以随时提问。</div>
        </div>
        <form id="askForm" class="ask-form">
          <textarea id="askInput" rows="2" data-i18n-ph="ask.placeholder" placeholder="问点什么…"></textarea>
          <button type="submit" id="btnAsk" data-i18n="ask.send">发送</button>
        </form>
      </div>
      <div class="statusbar">
        <span id="statusText" data-i18n="status.idle">待机</span>
        <span id="segCount">0</span>
      </div>
    </aside>
  </main>

  <div class="modal" id="modal" hidden>
    <div class="modal-card" id="modalCard"></div>
  </div>
  <div class="toasts" id="toasts"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
